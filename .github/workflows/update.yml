name: Update iGaming news

on:
  push:
    branches: [main]
    paths:
      - "scraper.py"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-igaming-news
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip feedparser

      - name: Scrape today's iGaming news
        run: python scraper.py

      - name: Commit updated news
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.js news.json
          if git diff --staged --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Update news"
            git push
          fi
