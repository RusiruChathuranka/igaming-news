<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iGaming News Hub</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --text:#1a1d21; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --accent:#60a5fa; --border:#272b33; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
  header { max-width:900px; margin:0 auto; padding:28px 16px 8px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  .meta { color:var(--muted); font-size:.85rem; }
  .controls { max-width:900px; margin:12px auto; padding:0 16px; display:flex; gap:8px; flex-wrap:wrap; }
  input, select { padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); font-size:.95rem; }
  input { flex:1; min-width:180px; }
  main { max-width:900px; margin:0 auto; padding:8px 16px 40px; display:grid; gap:12px; }
  article { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; }
  article a { color:var(--text); text-decoration:none; }
  article a:hover h2 { color:var(--accent); }
  h2 { margin:0 0 6px; font-size:1.1rem; line-height:1.3; }
  p { margin:0 0 8px; color:var(--muted); font-size:.92rem; line-height:1.45; }
  .tag { font-size:.75rem; color:var(--accent); font-weight:600; }
  .hero { border-left:4px solid var(--accent); }
  .hero h2 { font-size:1.5rem; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>iGaming News Hub</h1>
  <div class="meta" id="updated">Loading…</div>
</header>
<div class="controls">
  <input id="q" type="search" placeholder="Search headlines (e.g. licence, UKGC, Malta)…">
  <select id="src"><option value="">All sources</option></select>
</div>
<main><div id="hero"></div><div class="grid" id="list"></div></main>

<script src="news.js"></script>
<script>
let items = [];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const card = (i, cls='') => `
    <article class="${cls}">
      <a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">
        <span class="tag">${esc(i.source)}</span>
        <span class="meta"> · ${new Date(i.date).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}</span>
        <h2>${esc(i.title)}</h2>
        <p>${esc(i.summary)}</p>
      </a>
    </article>`;

function render() {
  const q = $('q').value.toLowerCase(), s = $('src').value;
  const shown = items.filter(i =>
    (!s || i.source === s) && (i.title + ' ' + i.summary).toLowerCase().includes(q));
  $('hero').innerHTML = shown.length ? card(shown[0], 'hero') : '';
  $('list').innerHTML = shown.length > 1 ? shown.slice(1).map(i => card(i)).join('')
    : (shown.length ? '' : '<div class="empty">No articles found.</div>');
}

function init(d) {
  items = d.items;
  $('updated').textContent = 'Last updated: ' + new Date(d.updated).toLocaleString();
  [...new Set(items.map(i => i.source))].sort().forEach(n =>
    $('src').insertAdjacentHTML('beforeend', `<option>${esc(n)}</option>`));
  render();
}

if (window.NEWS) init(window.NEWS);
else $('updated').textContent = 'news.js not found. Run scraper.py first.';

$('q').addEventListener('input', render);
$('src').addEventListener('change', render);
</script>
</body>
</html>
