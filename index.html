<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Latest iGaming industry news covering operators, regulation, technology, suppliers and markets worldwide.">
<meta name="theme-color" content="#ffffff">
<title>iGaming News Hub | Latest Industry News</title>
<style>
  :root {
    --bg:#ffffff; --surface:#ffffff; --soft:#f5f6f8; --text:#111827;
    --muted:#68707d; --accent:#e21b23; --border:#e5e7eb; --max:1180px;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  a { color:inherit; }
  .topbar { border-bottom:1px solid var(--border); background:#fff; }
  .header { max-width:var(--max); margin:auto; padding:22px 20px 16px; display:flex; align-items:end; justify-content:space-between; gap:20px; }
  .brand { text-decoration:none; }
  .brand h1 { margin:0; font-size:2rem; letter-spacing:-.04em; font-weight:850; }
  .brand p { margin:4px 0 0; color:var(--muted); font-size:.86rem; }
  .updated { color:var(--muted); font-size:.78rem; text-align:right; }
  nav { border-top:1px solid var(--border); }
  .nav-inner { max-width:var(--max); margin:auto; padding:0 20px; display:flex; gap:24px; overflow:auto; white-space:nowrap; }
  .nav-inner a { padding:13px 0; text-decoration:none; font-size:.83rem; font-weight:750; }
  .nav-inner a:hover { color:var(--accent); }
  .toolbar { max-width:var(--max); margin:24px auto 0; padding:0 20px; display:flex; gap:10px; }
  input, select { border:1px solid var(--border); border-radius:5px; background:#fff; color:var(--text); padding:11px 13px; font:inherit; }
  input { flex:1; min-width:220px; }
  main { max-width:var(--max); margin:auto; padding:20px 20px 60px; }
  .section-head { display:flex; justify-content:space-between; align-items:end; gap:15px; margin:8px 0 14px; border-bottom:2px solid var(--text); padding-bottom:9px; }
  .section-head h2 { margin:0; font-size:1.25rem; letter-spacing:-.02em; }
  .section-head span { color:var(--muted); font-size:.78rem; }
  .lead-grid { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(280px,.85fr); gap:18px; margin-bottom:28px; }
  article { min-width:0; }
  .lead { position:relative; background:#111; color:#fff; overflow:hidden; border-radius:4px; min-height:410px; }
  .lead img { width:100%; height:410px; object-fit:cover; display:block; opacity:.78; }
  .lead::after { content:""; position:absolute; inset:35% 0 0; background:linear-gradient(transparent,rgba(0,0,0,.92)); }
  .lead .content { position:absolute; z-index:1; left:0; right:0; bottom:0; padding:24px; }
  .lead h3 { margin:7px 0 9px; font-size:clamp(1.5rem,3vw,2.35rem); line-height:1.08; letter-spacing:-.035em; }
  .side { display:grid; gap:18px; }
  .side-card { display:grid; grid-template-columns:125px 1fr; gap:13px; padding-bottom:17px; border-bottom:1px solid var(--border); }
  .side-card:last-child { border-bottom:0; }
  .thumb { width:100%; height:92px; object-fit:cover; border-radius:3px; background:var(--soft); }
  .card-img { width:100%; height:190px; object-fit:cover; display:block; background:var(--soft); }
  .tag { color:var(--accent); text-transform:uppercase; font-size:.69rem; font-weight:850; letter-spacing:.05em; }
  .date { color:var(--muted); font-size:.72rem; }
  h3 { margin:6px 0; line-height:1.18; }
  .side-card h3 { font-size:1rem; }
  .summary { margin:0; color:var(--muted); font-size:.83rem; line-height:1.45; }
  .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; }
  .card { border-bottom:1px solid var(--border); padding-bottom:18px; }
  .card h3 { font-size:1.08rem; }
  .card a, .lead a { text-decoration:none; }
  .card a:hover h3, .side-card a:hover h3 { color:var(--accent); }
  .empty { padding:50px 0; text-align:center; color:var(--muted); }
  .no-image { display:flex; align-items:center; justify-content:center; color:#a0a7b2; font-size:.8rem; }
  @media (max-width:850px) {
    .header { align-items:flex-start; flex-direction:column; }
    .updated { text-align:left; }
    .lead-grid { grid-template-columns:1fr; }
    .cards { grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  @media (max-width:560px) {
    .brand h1 { font-size:1.65rem; }
    .toolbar { flex-direction:column; }
    .cards { grid-template-columns:1fr; }
    .lead, .lead img { min-height:300px; height:300px; }
    .lead .content { padding:18px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="header">
    <a class="brand" href="./">
      <h1>iGaming News Hub</h1>
      <p>The latest news from the global iGaming industry</p>
    </a>
    <div class="updated" id="updated">Loading latest news…</div>
  </div>
  <nav>
    <div class="nav-inner">
      <a href="#today">Latest</a><a href="#today">iGaming</a><a href="#today">Sportsbook</a>
      <a href="#today">Regulation</a><a href="#today">Technology</a><a href="#today">Affiliates</a>
      <a href="#today">Markets</a><a href="sri-lanka.html">Sri Lanka</a><a href="#today">All News</a>
    </div>
  </nav>
</header>

<div class="toolbar">
  <input id="q" type="search" placeholder="Search iGaming news…">
  <select id="src"><option value="">All sources</option></select>
</div>

<main id="today">
  <div class="section-head">
    <h2>Today's News</h2>
    <span id="count"></span>
  </div>
  <div id="content"></div>
</main>

<script src="news.js?v=20261006"></script>
<script>
let items = [];
const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeUrl = url => /^https?:\/\//i.test(url || '') ? url : '#';
const dateText = d => new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const image = (src, cls='card-img') => src
  ? '<img class="' + cls + '" src="' + esc(src) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
  : '<div class="' + cls + ' no-image">iGaming News</div>';

function leadCard(i) {
  return '<article class="lead"><a href="' + esc(safeUrl(i.link)) + '" target="_blank" rel="noopener noreferrer">' +
    image(i.image,'card-img') +
    '<div class="content"><span class="tag">' + esc(i.source) + '</span>' +
    '<span class="date"> · ' + dateText(i.date) + '</span>' +
    '<h3>' + esc(i.title) + '</h3><p class="summary">' + esc(i.summary) + '</p></div></a></article>';
}
function sideCard(i) {
  return '<article class="side-card"><a href="' + esc(safeUrl(i.link)) + '" target="_blank" rel="noopener noreferrer">' +
    image(i.image,'thumb') + '</a><div><a href="' + esc(safeUrl(i.link)) + '" target="_blank" rel="noopener noreferrer">' +
    '<span class="tag">' + esc(i.source) + '</span><h3>' + esc(i.title) + '</h3></a>' +
    '<span class="date">' + dateText(i.date) + '</span></div></article>';
}
function gridCard(i) {
  return '<article class="card"><a href="' + esc(safeUrl(i.link)) + '" target="_blank" rel="noopener noreferrer">' +
    image(i.image) + '<span class="tag">' + esc(i.source) + '</span>' +
    '<span class="date"> · ' + dateText(i.date) + '</span><h3>' + esc(i.title) + '</h3>' +
    '<p class="summary">' + esc(i.summary) + '</p></a></article>';
}
function localDateKey(d) {
  const x = new Date(d);
  return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');
}
function render() {
  const q = $('q').value.trim().toLowerCase(), s = $('src').value;
  const filtered = items.filter(i => (!s || i.source === s) &&
    ((i.title || '') + ' ' + (i.summary || '')).toLowerCase().includes(q));
  const todayKey = localDateKey(new Date());
  const today = filtered.filter(i => localDateKey(i.date) === todayKey);
  const shown = today.length ? today : filtered.slice(0, 12);
  $('count').textContent = today.length ? today.length + ' articles today' : 'Showing latest articles';
  if (!shown.length) {
    $('content').innerHTML = '<div class="empty">No articles found.</div>';
    return;
  }
  const lead = shown[0];
  const side = shown.slice(1,4);
  const rest = shown.slice(4);
  $('content').innerHTML =
    '<div class="lead-grid"><div>' + leadCard(lead) + '</div>' +
    '<div class="side">' + side.map(sideCard).join('') + '</div></div>' +
    (rest.length ? '<div class="cards">' + rest.map(gridCard).join('') + '</div>' : '');
}
function init(d) {
  items = Array.isArray(d.items) ? d.items.filter(i => i && i.title && i.link) : [];
  $('updated').textContent = 'Updated ' + new Date(d.updated).toLocaleString();
  [...new Set(items.map(i => i.source).filter(Boolean))].sort().forEach(n =>
    $('src').insertAdjacentHTML('beforeend','<option value="' + esc(n) + '">' + esc(n) + '</option>'));
  render();
}
if (window.NEWS) init(window.NEWS);
else $('updated').textContent = 'News feed unavailable.';
$('q').addEventListener('input', render);
$('src').addEventListener('change', render);
</script>
</body>
</html>
